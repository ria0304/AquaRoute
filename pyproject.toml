[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aquaroute"
version = "0.1.0"
description = "Algorithmic optimization for reliable community water distribution"
readme = "readme.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["water-distribution", "optimization", "fairness", "research", "network-flow"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]

# Runtime dependencies actually imported by aquaroute.algorithms / models.
dependencies = [
    "networkx>=3.0",
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "pyomo>=6.6",
    "wntr>=1.2",
    "six>=1.16",  # wntr imports six but does not declare it
]

[project.optional-dependencies]
# A supported LP solver backend.  Without one the analytical fallback is used.
solver = ["highspy>=1.5"]
figures = ["matplotlib>=3.7"]
dashboard = ["streamlit>=1.30", "plotly>=5.18"]
dev = ["pytest>=7.4", "pytest-cov>=4.0"]

[project.scripts]
aquaroute-dashboard = "aquaroute.scripts.streamlit_dashboard:main"
aquaroute-experiments = "aquaroute.scripts.run_experiments:main"

[tool.setuptools.packages.find]
include = ["aquaroute*"]

[tool.pytest.ini_options]
testpaths = ["aquaroute/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Correctness (pyflakes), pycodestyle errors, and import ordering.
select = ["E", "F", "I"]
ignore = ["E501", "E741"]
